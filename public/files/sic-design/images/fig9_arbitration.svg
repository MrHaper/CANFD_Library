chor="middle">ID8</text><line x1="490.0" y1="140.0" x2="490.0" y2="540.0" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4 4"/><text x="490.0" y="128.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#d97706" font-weight="bold" text-anchor="middle">A 发隐性,B 发显性 → B 胜出</text><text x="610.0" y="606.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">非破坏性:胜者继续发送,无需重发;失败节点在帧间空间后自动重发</text></svg>

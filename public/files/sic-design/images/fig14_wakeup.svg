<text x="85.0" y="165.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">总线</text><path d="M 130.0 195.0 L 270.0 195.0 L 270.0 195.0 L 440.0 195.0 L 440.0 250.0 L 500.0 250.0 L 500.0 250.0 L 590.0 250.0 L 590.0 195.0 L 640.0 195.0 L 640.0 250.0 L 730.0 250.0 L 730.0 195.0 L 790.0 195.0 L 790.0 250.0 L 930.0 250.0 L 930.0 195.0" fill="none" stroke="#0f4c81" stroke-width="2.2" stroke-linejoin="round"/><text x="300.0" y="112.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#d97706" font-weight="normal" text-anchor="middle">显性 ≥ tFilter</text><text x="520.0" y="112.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">隐性 ≥ tFilter</text><text x="700.0" y="112.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#d97706" font-weight="normal" text-anchor="middle">显性 ≥ tFilter</text><rect x="300.0" y="280.0" width="400.0" height="40.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/><text x="500.0" y="305.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b3a12" font-weight="bold" text-anchor="middle">唤醒模式 WUP:两个显性脉冲</text><text x="85.0" y="400.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">RXD(唤醒输出)</text><path d="M 130.0 485.0 L 270.0 485.0 L 270.0 485.0 L 740.0 485.0 L 740.0 430.0 L 970.0 430.0 L 970.0 485.0 L 1120.0 485.0 L 1120.0 430.0" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linejoin="round"/><rect x="130.0" y="510.0" width="380.0" height="90.0" rx="10" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="320.0" y="540.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0a3a63" font-weight="bold" text-anchor="middle">tFilter:长 0.5~5.0 µs / 短 0.15~1.8 µs</text><text x="320.0" y="566.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">tWake:800 µs ~ 10 ms(可选)</text><rect x="560.0" y="510.0" width="380.0" height="90.0" rx="10" fill="#e7f6ef" stroke="#16a34a" stroke-width="1.3"/><text x="750.0" y="540.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0b4b37" font-weight="bold" text-anchor="middle">选择性唤醒 WUF:按帧 ID 过滤</text><text x="750.0" y="566.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#0b4b37" font-weight="normal" text-anchor="middle">Standby/Sleep 模式均依赖唤醒机制</text><text x="600.0" y="632.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">设计关联:唤醒滤波器决定抗毛刺与唤醒延迟的折衷</text></svg>

<text x="36" y="32" font-size="22" font-weight="bold" fill="#ffffff">图 14 总线唤醒时序</text>
<text x="36" y="53" font-size="13" fill="#c7d6ea">基本唤醒(单显性 ≥ tFilter)、WUP(双显性)与 WUF(帧 ID 过滤)</text>

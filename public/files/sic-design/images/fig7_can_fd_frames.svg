<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="62" fill="#0a3a63"/>
<text x="36" y="30" font-size="22" font-weight="bold" fill="#ffffff">图 7 经典 CAN vs CAN FD 帧格式</text>
<text x="36" y="51" font-size="13" fill="#c7d6ea">CAN FD 的秘密在控制场:EDL / BRS / ESI 三个标志位</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/>
</marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
</marker>
<marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
  <circle cx="4" cy="4" r="3" fill="#64748b"/>
</marker>
</defs>
<text x="90.0" y="100.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">经典 CAN 数据帧</text><rect x="90.0" y="118.0" width="90.0" height="52.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="135.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">SOF</text><text x="135.0" y="158.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1 位</text><rect x="170.0" y="118.0" width="120.0" height="52.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="230.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">仲裁场</text><text x="230.0" y="158.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">11/29 位 ID + RTR</text><rect x="330.0" y="118.0" width="120.0" height="52.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="390.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">控制场</text><text x="390.0" y="158.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">IDE · r1 + DLC</text><rect x="450.0" y="118.0" width="120.0" height="52.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="510.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">数据场</text><text x="510.0" y="158.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">0~8 字节</text><rect x="540.0" y="118.0" width="120.0" height="52.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="600.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">CRC</text><text x="600.0" y="158.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">15 位 + delimiter</text><rect x="660.0" y="118.0" width="90.0" height="52.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="705.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">ACK</text><text x="705.0" y="158.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">slot + delimiter</text><rect x="740.0" y="118.0" width="100.0" height="52.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="790.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">EOF</text><text x="790.0" y="158.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">7 位隐性</text><text x="90.0" y="280.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">CAN FD 数据帧</text><rect x="90.0" y="298.0" width="90.0" height="56.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="135.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">SOF</text><text x="135.0" y="341.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1 位</text><rect x="170.0" y="298.0" width="100.0" height="56.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="220.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">仲裁场</text><text x="220.0" y="341.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">11/29 位 ID + RRS</text><rect x="330.0" y="298.0" width="130.0" height="56.0" rx="6" fill="#fff3dd" stroke="#d97706" stroke-width="1.6"/><text x="395.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#5b3a12" font-weight="bold" text-anchor="middle">控制场</text><text x="395.0" y="341.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">IDE·EDL·res·BRS·ESI·DLC</text><rect x="460.0" y="298.0" width="100.0" height="56.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="510.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">数据场</text><text x="510.0" y="341.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">0~64 字节</text><rect x="560.0" y="298.0" width="100.0" height="56.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="610.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">CRC</text><text x="610.0" y="341.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">17/21 位 + 填充</text><rect x="680.0" y="298.0" width="90.0" height="56.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="725.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">ACK</text><text x="725.0" y="341.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">slot + delimiter</text><rect x="760.0" y="298.0" width="100.0" height="56.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="810.0" y="320.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#0a3a63" font-weight="bold" text-anchor="middle">EOF</text><text x="810.0" y="341.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">7 位隐性</text><line x1="410.0" y1="230.0" x2="410.0" y2="298.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/><text x="505.0" y="242.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#d97706" font-weight="normal" text-anchor="middle">BRS 隐性 → 数据相位高速率(如 2/5 Mbit/s)</text><line x1="620.0" y1="230.0" x2="620.0" y2="298.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="700.0" y="242.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">CRC delimiter 切回仲裁速率</text><text x="515.0" y="395.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">一句话记忆:EDL 决定「这是什么帧」,BRS 决定「数据段跑多快」,ESI 报告「发送方状态」</text><rect x="90.0" y="440.0" width="320.0" height="34.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="250.0" y="462.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">仲裁相位(经典速率,如 500 kbit/s)</text><rect x="410.0" y="440.0" width="210.0" height="34.0" rx="6" fill="#e7f6ef" stroke="#16a34a" stroke-width="1.3"/><text x="515.0" y="462.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0b4b37" font-weight="bold" text-anchor="middle">数据相位(高速率)</text><rect x="620.0" y="440.0" width="280.0" height="34.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="760.0" y="462.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">仲裁速率(ACK/EOF)</text></svg>

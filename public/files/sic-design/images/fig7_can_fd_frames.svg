<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="66" fill="#0a3a63"/>
<text x="36" y="32" font-size="22" font-weight="bold" fill="#ffffff">图 7 经典 CAN vs CAN FD 帧格式</text>
<text x="36" y="53" font-size="13" fill="#c7d6ea">CAN FD 的秘密在控制场:EDL / BRS / ESI 三个标志位</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/></marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
</defs>
<text x="90.0" y="94.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">经典 CAN 数据帧</text><rect x="90.0" y="120.0" width="80.0" height="58.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.4"/><text x="130.0" y="143.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">SOF</text><text x="130.0" y="162.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">1 位</text><rect x="170.0" y="120.0" width="210.0" height="58.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.4"/><text x="275.0" y="143.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">仲裁场</text><text x="275.0" y="162.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">11/29 位 ID + RTR</text><rect x="380.0" y="120.0" width="170.0" height="58.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.4"/><text x="465.0" y="143.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">控制场</text><text x="465.0" y="162.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">IDE·r1 + DLC</text><rect x="550.0" y="120.0" width="170.0" height="58.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.4"/><text x="635.0" y="143.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">数据场</text><text x="635.0" y="162.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">0~8 字节</text><rect x="720.0" y="120.0" width="180.0" height="58.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.4"/><text x="810.0" y="143.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">CRC 场</text><text x="810.0" y="162.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">15 位 + 分隔符</text><rect x="900.0" y="120.0" width="110.0" height="58.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.4"/><text x="955.0" y="143.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">ACK</text><text x="955.0" y="162.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">slot + del</text><rect x="1010.0" y="120.0" width="100.0" height="58.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.4"/><text x="1060.0" y="143.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">EOF</text><text x="1060.0" y="162.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">7 位隐性</text><text x="90.0" y="334.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="start">CAN FD 数据帧</text><rect x="90.0" y="360.0" width="80.0" height="58.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.4"/><text x="130.0" y="383.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">SOF</text><text x="130.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">1 位</text><rect x="170.0" y="360.0" width="210.0" height="58.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.4"/><text x="275.0" y="383.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">仲裁场</text><text x="275.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">ID + RRS</text><rect x="380.0" y="360.0" width="230.0" height="58.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.4"/><text x="495.0" y="383.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">控制场</text><text x="495.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">IDE·EDL·res·BRS·ESI·DLC</text><rect x="610.0" y="360.0" width="180.0" height="58.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.4"/><text x="700.0" y="383.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">数据场</text><text x="700.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">0~64 字节</text><rect x="790.0" y="360.0" width="180.0" height="58.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.4"/><text x="880.0" y="383.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">CRC 场</text><text x="880.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">17/21 位 + 填充</text><rect x="970.0" y="360.0" width="110.0" height="58.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.4"/><text x="1025.0" y="383.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">ACK</text><text x="1025.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">slot + del</text><rect x="1080.0" y="360.0" width="100.0" height="58.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.4"/><text x="1130.0" y="383.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0a3a63" font-weight="bold" text-anchor="middle">EOF</text><text x="1130.0" y="402.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="middle">7 位隐性</text><line x1="410.0" y1="320.0" x2="410.0" y2="360.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/><text x="510.0" y="340.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#d97706" font-weight="bold" text-anchor="middle">BRS 隐性 → 数据相位高速率(如 2/5 Mbit/s)</text><line x1="630.0" y1="320.0" x2="630.0" y2="360.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="740.0" y="340.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">CRC delimiter 切回仲裁速率</text><text x="600.0" y="470.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">一句话记忆:EDL 决定「这是什么帧」,BRS 决定「数据段跑多快」,ESI 报告「发送方状态」</text><rect x="90.0" y="520.0" width="330.0" height="36.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="255.0" y="542.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">仲裁相位(经典速率,如 500 kbit/s)</text><rect x="420.0" y="520.0" width="230.0" height="36.0" rx="8" fill="#e7f6ef" stroke="#16a34a" stroke-width="1.3"/><text x="535.0" y="542.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#0b4b37" font-weight="bold" text-anchor="middle">数据相位(高速率)</text><rect x="650.0" y="520.0" width="280.0" height="36.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="790.0" y="542.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">仲裁速率(ACK/EOF)</text><text x="600.0" y="620.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">DLC 非连续映射:0~8 直映,9~15 → 12/16/20/24/32/48/64 字节</text></svg>

',Arial,sans-serif" font-size="12" fill="#0a3a63" font-weight="normal" text-anchor="middle">节点 1</text><rect x="932.0" y="242.0" width="56.0" height="36.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="960.0" y="265.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0a3a63" font-weight="normal" text-anchor="middle">节点 2</text><rect x="1012.0" y="242.0" width="56.0" height="36.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="1040.0" y="265.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0a3a63" font-weight="normal" text-anchor="middle">节点 3</text><rect x="810.0" y="206.0" width="56.0" height="30.0" rx="6" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/><text x="838.0" y="225.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#5b3a12" font-weight="bold" text-anchor="middle">60 Ω</text><rect x="1152.0" y="206.0" width="56.0" height="30.0" rx="6" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/><text x="1180.0" y="225.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#5b3a12" font-weight="bold" text-anchor="middle">60 Ω</text><text x="600.0" y="380.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">经验法则:HS-CAN 500 kbps 能工作的网络 → CAN SIC 2 Mbps 也能工作;</text><text x="600.0" y="410.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">HS-CAN 2 Mbps 能工作的网络 → CAN SIC 5 Mbps 也能工作(Adamson 2020)</text><text x="600.0" y="470.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">端接:总线两端各 60 Ω(等效 120 Ω);stub 越短越好;线缆阻抗 110~140 Ω(CiA 601-6)</text><text x="600.0" y="510.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">PVC 绝缘线缆阻抗温度敏感、传播延迟大,会放大振铃,SIC 仅部分补偿</text></svg>

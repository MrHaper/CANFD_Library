<text x="36" y="30" font-size="22" font-weight="bold" fill="#ffffff">图 5 安全操作区与采样点</text>
<text x="36" y="51" font-size="13" fill="#c7d6ea">信号可在安全操作区内自由振荡,但必须在最早隐性采样点前回到 0.5 V 以下</text>

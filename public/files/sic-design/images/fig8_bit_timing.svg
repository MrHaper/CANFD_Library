<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="66" fill="#0a3a63"/>
<text x="36" y="32" font-size="22" font-weight="bold" fill="#ffffff">图 8 位时间结构与采样点</text>
<text x="36" y="53" font-size="13" fill="#c7d6ea">一位时间 = Sync_Seg + Prop_Seg + Phase_Seg1 + Phase_Seg2,采样点在 PS1/PS2 边界</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/></marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
</defs>
<rect x="140.0" y="210.0" width="120.0" height="54.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.5"/><text x="200.0" y="233.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Sync_Seg</text><text x="200.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1 tq</text><text x="200.0" y="288.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">同步段</text><rect x="260.0" y="210.0" width="300.0" height="54.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="233.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Prop_Seg</text><text x="410.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1~8 tq</text><text x="410.0" y="288.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">传播段</text><rect x="560.0" y="210.0" width="300.0" height="54.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.5"/><text x="710.0" y="233.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Phase_Seg1</text><text x="710.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1~8 tq</text><text x="710.0" y="288.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">相位段 1</text><rect x="860.0" y="210.0" width="220.0" height="54.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.5"/><text x="970.0" y="233.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Phase_Seg2</text><text x="970.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">2~8 tq</text><text x="970.0" y="288.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">相位段 2</text><line x1="860.0" y1="130.0" x2="860.0" y2="430.0" stroke="#0f4c81" stroke-width="1.8" stroke-dasharray="5 4"/><text x="860.0" y="118.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0f4c81" font-weight="bold" text-anchor="middle">采样点</text><text x="1010.0" y="345.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#0f4c81" font-weight="normal" text-anchor="middle">PS1/PS2 边界</text><line x1="140.0" y1="360.0" x2="1080.0" y2="360.0" stroke="#64748b" stroke-width="1.2"/><text x="610.0" y="390.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="middle">一位时间 tBit = m × tq(tq = 节点时钟周期 × 预分频)</text><line x1="560.0" y1="470.0" x2="470.0" y2="470.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrA)"/><line x1="470.0" y1="505.0" x2="560.0" y2="505.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrA)"/><text x="515.0" y="486.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#d97706" font-weight="normal" text-anchor="middle">SJW 调整</text><text x="610.0" y="545.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">再同步:相位误差超过容差时,PS1/PS2 可伸缩 ≤ SJW(1~4 tq)</text><text x="610.0" y="590.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">配置范围示例(ISO 11898-1:2024 Table 12,支持 FD 的实现)</text></svg>

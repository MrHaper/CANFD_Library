<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="62" fill="#0a3a63"/>
<text x="36" y="30" font-size="22" font-weight="bold" fill="#ffffff">图 15 振铃抑制电路原理</text>
<text x="36" y="51" font-size="13" fill="#c7d6ea">显性→隐性转换瞬间的低阻泄放通路 + 振铃检测阻尼(各厂商专利思路)</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/>
</marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
</marker>
<marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
  <circle cx="4" cy="4" r="3" fill="#64748b"/>
</marker>
</defs>
<rect x="110.0" y="150.0" width="220.0" height="120.0" rx="8" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/>
<text x="220.0" y="174.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">驱动器输出级</text>
<text x="220.0" y="216.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">M1~M6(含高压/负压保护)</text>
<text x="220.0" y="233.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">显性驱动 / 高阻</text><line x1="330.0" y1="190.0" x2="430.0" y2="190.0" stroke="#0f4c81" stroke-width="2"/><line x1="330.0" y1="230.0" x2="430.0" y2="230.0" stroke="#0f4c81" stroke-width="2"/><text x="380.0" y="172.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0a3a63" font-weight="normal" text-anchor="middle">CANH</text><text x="380.0" y="212.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0a3a63" font-weight="normal" text-anchor="middle">CANL</text><line x1="430.0" y1="190.0" x2="430.0" y2="230.0" stroke="#64748b" stroke-width="1.2"/><text x="470.0" y="215.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">总线</text><rect x="110.0" y="330.0" width="220.0" height="100.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/>
<text x="220.0" y="354.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Recessive Nulling</text>
<text x="220.0" y="386.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">并联低阻通路加速放电</text>
<text x="220.0" y="403.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">LRN / HRN 可编程</text><line x1="220.0" y1="270.0" x2="220.0" y2="330.0" stroke="#d97706" stroke-width="1.8"/><line x1="330.0" y1="380.0" x2="430.0" y2="380.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/><rect x="420.0" y="330.0" width="240.0" height="100.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/>
<text x="540.0" y="354.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">脉冲发生器(~200 ns)</text>
<text x="540.0" y="386.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">驱动 nulling 将内部节点</text>
<text x="540.0" y="403.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">拉到 VCM</text><line x1="420.0" y1="380.0" x2="330.0" y2="380.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr)"/><rect x="420.0" y="140.0" width="240.0" height="100.0" rx="8" fill="#e7f6ef" stroke="#16a34a" stroke-width="1.3"/>
<text x="540.0" y="164.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">振铃检测 / 阻尼</text>
<text x="540.0" y="196.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">电容耦合 → 幅度超阈值</text>
<text x="540.0" y="213.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">导通 NMOS 泄放振铃能量</text><line x1="430.0" y1="190.0" x2="420.0" y2="190.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/><line x1="540.0" y1="190.0" x2="540.0" y2="240.0" stroke="#64748b" stroke-width="1.5"/><line x1="540.0" y1="240.0" x2="540.0" y2="330.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/><rect x="720.0" y="330.0" width="200.0" height="100.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
<text x="820.0" y="354.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">VCM 参考</text>
<text x="820.0" y="386.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">内部共模电平</text><line x1="660.0" y1="380.0" x2="720.0" y2="380.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="515.0" y="500.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">设计要点:nulling 时长可寄存器编程;终止时刻必须与采样点错开;额外低阻通路增加转换瞬间电流,需评估 EMC</text><text x="515.0" y="530.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">对应专利:TI US9606948B2(recessive nulling)、US11310072B2(瞬态触发)、Microchip US11539548B2(阻抗匹配)</text></svg>

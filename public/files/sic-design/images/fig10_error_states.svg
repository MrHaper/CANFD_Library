<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1200" height="620" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="66" fill="#0a3a63"/>
<text x="36" y="32" font-size="22" font-weight="bold" fill="#ffffff">图 10 故障遏制状态机</text>
<text x="36" y="53" font-size="13" fill="#c7d6ea">error-active → error-passive → bus-off,恢复请求 + 128 次空闲回到 active</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/></marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
</defs>
<rect x="110.0" y="175.0" width="260.0" height="110.0" rx="10" fill="#e7f6ef" stroke="#16a34a" stroke-width="1.3"/>
<text x="240.0" y="222.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">error-active</text>
<text x="240.0" y="244.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">TEC≤127 且 REC≤127</text>
<text x="240.0" y="260.9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">正常收发,主动错误帧</text><rect x="470.0" y="175.0" width="260.0" height="110.0" rx="10" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/>
<text x="600.0" y="222.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">error-passive</text>
<text x="600.0" y="244.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">REC&gt;127 或 TEC&gt;127 被动错误帧 +</text>
<text x="600.0" y="260.9" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">suspend 8 位</text><rect x="830.0" y="175.0" width="260.0" height="110.0" rx="10" fill="#fde8e8" stroke="#b45309" stroke-width="1.3"/>
<text x="960.0" y="222.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle">bus-off</text>
<text x="960.0" y="244.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">TEC&gt;255 不发送 / 不应答 / 不拉显性</text><line x1="380.0" y1="230.0" x2="470.0" y2="230.0" stroke="#d97706" stroke-width="2" marker-end="url(#arrA)"/><text x="425.0" y="214.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#d97706" font-weight="bold" text-anchor="middle">T2</text><line x1="470.0" y1="260.0" x2="380.0" y2="260.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="425.0" y="278.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="bold" text-anchor="middle">T3</text><line x1="740.0" y1="230.0" x2="830.0" y2="230.0" stroke="#b45309" stroke-width="2" marker-end="url(#arr)"/><text x="785.0" y="214.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b45309" font-weight="bold" text-anchor="middle">T4</text><path d="M 960 300 C 960 420 240 420 240 300" fill="none" stroke="#0f4c81" stroke-width="1.6"/><line x1="240.0" y1="300.0" x2="240.0" y2="288.0" stroke="#0f4c81" stroke-width="1.8" marker-end="url(#arr)"/><text x="600.0" y="430.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0f4c81" font-weight="bold" text-anchor="middle">T5:恢复请求 + 128 次空闲(11 连续隐性位)→ 计数清零</text><text x="600.0" y="520.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">计数增减(§8.1.4):成功收发递减,错误递增;主动/被动节点规则不同</text><text x="600.0" y="560.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#1f2933" font-weight="bold" text-anchor="middle">故障遏制保证单个故障节点不会拖垮总线</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1200" height="660" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="66" fill="#0a3a63"/>
<text x="36" y="32" font-size="22" font-weight="bold" fill="#ffffff">图 11 TDC 发射器延迟补偿原理</text>
<text x="36" y="53" font-size="13" fill="#c7d6ea">SSP = 测得环回延迟 + 可编程 TDC 偏移(以 tq 为单位)</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/></marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/></marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/></marker>
</defs>
<text x="85.0" y="202.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">控制器 TXD</text><path d="M 150.0 180.0 L 300.0 180.0 L 300.0 180.0 L 540.0 180.0 L 540.0 235.0 L 780.0 235.0 L 780.0 235.0 L 1020.0 235.0 L 1020.0 180.0" fill="none" stroke="#0f4c81" stroke-width="2.2" stroke-linejoin="round"/><text x="85.0" y="342.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">总线</text><path d="M 150.0 320.0 L 300.0 320.0 L 300.0 320.0 L 540.0 320.0 L 540.0 375.0 L 780.0 375.0 L 780.0 375.0 L 1020.0 375.0 L 1020.0 320.0" fill="none" stroke="#0a3a63" stroke-width="2.2" stroke-linejoin="round"/><text x="85.0" y="482.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">收发器 RXD(回读)</text><path d="M 150.0 460.0 L 300.0 460.0 L 300.0 460.0 L 540.0 460.0 L 540.0 515.0 L 780.0 515.0 L 780.0 515.0 L 1020.0 515.0 L 1020.0 460.0" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linejoin="round"/><line x1="1060.0" y1="210.0" x2="1060.0" y2="290.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="1160.0" y="252.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="end" text-anchor="middle">td(TXD→bus)</text><line x1="1060.0" y1="350.0" x2="1060.0" y2="430.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="1160.0" y="392.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="end" text-anchor="middle">td(bus→RXD)</text><line x1="1030.0" y1="200.0" x2="1030.0" y2="480.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrA)" stroke-dasharray="5 4"/><text x="1030.0" y="560.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#d97706" font-weight="bold" text-anchor="middle">环回延迟 tLoop ≤ 190 ns</text><line x1="520.0" y1="100.0" x2="520.0" y2="560.0" stroke="#0f4c81" stroke-width="1.4" stroke-dasharray="4 4"/><text x="520.0" y="88.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#0f4c81" font-weight="bold" text-anchor="middle">正常采样点</text><line x1="760.0" y1="100.0" x2="760.0" y2="560.0" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 4"/><text x="760.0" y="88.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#16a34a" font-weight="bold" text-anchor="middle">SSP 二次采样点</text><line x1="520.0" y1="590.0" x2="760.0" y2="590.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/><text x="640.0" y="606.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#16a34a" font-weight="bold" text-anchor="middle">TDC 偏移(可编程,tq 为单位)</text><text x="600.0" y="640.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">数据相位位时间 ≤1000 ns 时应使用 TDC;环回延迟越小、对称性越好,SSP 裕量越大</text></svg>

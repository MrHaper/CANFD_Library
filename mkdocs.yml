site_name: CAN FD 知识库
site_url: https://MrHaper.github.io/CANFD_Library/
site_description: 面向模拟IC设计工程师与嵌入式工程师的 CAN FD 学习资料库
repo_url: https://github.com/MrHaper/CANFD_Library

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes        # section index 页(每个板块 index.md)
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle: { icon: material/brightness-7, name: 切换到深色模式 }
    - scheme: slate
      primary: indigo
      accent: blue
      toggle: { icon: material/brightness-4, name: 切换到浅色模式 }
  icon:
    repo: fontawesome/brands/github
    tag:
      beginner: material/school
      intermediate: material/arrow-up-bold-circle
      expert: material/star
      analog-ic: material/chip
      embedded: material/memory

plugins:
  - search:
      lang: zh
      jieba_dict_user: user_dict.txt
  - tags          # 标签索引
  - meta          # .meta.yml 板块级公共元数据
  - minify: { minify_html: true }   # 需 requirements.txt 含 mkdocs-minify-plugin

# requirements.txt 内容:
#   mkdocs-material>=9.6
#   mkdocs-minify-plugin

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - tables
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }
      permalink: true

extra:
  tags:
    入门: beginner
    进阶: intermediate
    专家: expert
    模拟IC: analog-ic
    嵌入式: embedded

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:                     # 显式声明全部板块(不依赖自动发现)
  - 首页: index.md
  - 学习路线:
      - learn/index.md
      - 模拟IC工程师: learn/analog-ic.md
      - 嵌入式工程师: learn/embedded.md
  - 知识库:
      - knowledge/index.md
      - 协议基础: knowledge/protocol/index.md
      - 位定时与同步: knowledge/bit-timing/index.md
      - 物理层与SIC: knowledge/physical-layer/index.md
      - 收发器设计: knowledge/transceiver-design/index.md
      - 控制器与驱动: knowledge/controller/index.md
      - 工具与测试: knowledge/tools/index.md
      - 项目实践笔记: knowledge/project-notes/index.md
  - 教程: tutorials/index.md
  - 资源库:
      - resources/index.md
      - 标准规范: resources/standards.md
      - 标准查阅: resources/standards-text/index.md
      - 专利: resources/patents.md
      - 论文: resources/papers.md
      - 期刊: resources/journals.md
      - 教材书籍: resources/books.md
      - 厂商资料: resources/vendors.md
      - 工具与社区: resources/tools-community.md
  - 术语表: glossary/index.md
  - 勘误与贡献: contribute.md
  - 关于: about.md

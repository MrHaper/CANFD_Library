<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="62" fill="#0a3a63"/>
<text x="36" y="30" font-size="22" font-weight="bold" fill="#ffffff">图 8 位时间结构与采样点</text>
<text x="36" y="51" font-size="13" fill="#c7d6ea">一位时间 = Sync_Seg + Prop_Seg + Phase_Seg1 + Phase_Seg2,采样点在 PS1/PS2 边界</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/>
</marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
</marker>
<marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
  <circle cx="4" cy="4" r="3" fill="#64748b"/>
</marker>
</defs>
<rect x="110.0" y="220.0" width="100.0" height="40.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.5"/><text x="160.0" y="238.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Sync_Seg</text><text x="160.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1 tq</text><rect x="210.0" y="220.0" width="260.0" height="40.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="340.0" y="238.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Prop_Seg</text><text x="340.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1~8 tq</text><rect x="470.0" y="220.0" width="260.0" height="40.0" rx="6" fill="#fff3dd" stroke="#d97706" stroke-width="1.5"/><text x="600.0" y="238.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Phase_Seg1</text><text x="600.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">1~8 tq</text><rect x="730.0" y="220.0" width="180.0" height="40.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.5"/><text x="820.0" y="238.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Phase_Seg2</text><text x="820.0" y="253.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b" font-weight="normal" text-anchor="middle">2~8 tq</text><line x1="730.0" y1="150.0" x2="730.0" y2="420.0" stroke="#0f4c81" stroke-width="1.8" stroke-dasharray="5 4"/><text x="730.0" y="138.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#0f4c81" font-weight="normal" text-anchor="middle">采样点</text><text x="760.0" y="330.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0f4c81" font-weight="normal" text-anchor="middle">PS1/PS2 边界</text><line x1="110.0" y1="310.0" x2="910.0" y2="310.0" stroke="#64748b" stroke-width="1.2"/><text x="510.0" y="340.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#1f2933" font-weight="normal" text-anchor="middle">一位时间 tBit = m × tq(tq = 节点时钟周期 × 预分频)</text><line x1="660.0" y1="400.0" x2="560.0" y2="400.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrA)"/><line x1="560.0" y1="430.0" x2="660.0" y2="430.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrA)"/><text x="610.0" y="415.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#d97706" font-weight="normal" text-anchor="middle">SJW 调整</text><text x="610.0" y="470.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">再同步:相位误差超过容差时,PS1/PS2 可伸缩 ≤ SJW(1~4 tq)</text><text x="510.0" y="530.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">配置范围示例(ISO 11898-1:2024 Table 12,支持 FD 的实现)</text></svg>

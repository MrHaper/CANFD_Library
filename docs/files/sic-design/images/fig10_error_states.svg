<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif">
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
<rect x="0" y="0" width="1000" height="62" fill="#0a3a63"/>
<text x="36" y="30" font-size="22" font-weight="bold" fill="#ffffff">图 10 故障遏制状态机</text>
<text x="36" y="51" font-size="13" fill="#c7d6ea">error-active → error-passive → bus-off,恢复请求 + 128 次空闲回到 active</text>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#0f4c81"/>
</marker>
<marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
</marker>
<marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
</marker>
<marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
  <circle cx="4" cy="4" r="3" fill="#64748b"/>
</marker>
</defs>
<rect x="120.0" y="180.0" width="220.0" height="90.0" rx="8" fill="#e7f6ef" stroke="#16a34a" stroke-width="1.3"/>
<text x="230.0" y="204.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">error-active</text>
<text x="230.0" y="231.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">TEC≤127 且 REC≤127</text>
<text x="230.0" y="248.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">正常收发,主动错误帧</text><rect x="390.0" y="180.0" width="220.0" height="90.0" rx="8" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/>
<text x="500.0" y="204.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">error-passive</text>
<text x="500.0" y="231.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">REC&gt;127 或 TEC&gt;127</text>
<text x="500.0" y="248.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">被动错误帧 + suspend 8 位</text><rect x="660.0" y="180.0" width="220.0" height="90.0" rx="8" fill="#fde8e8" stroke="#b45309" stroke-width="1.3"/>
<text x="770.0" y="204.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">bus-off</text>
<text x="770.0" y="231.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">TEC&gt;255</text>
<text x="770.0" y="248.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#1f2933" font-weight="normal" text-anchor="middle">不发送 / 不应答 / 不拉显性</text><line x1="340.0" y1="225.0" x2="390.0" y2="225.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrA)"/><text x="365.0" y="210.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#d97706" font-weight="bold" text-anchor="middle">T2</text><line x1="390.0" y1="290.0" x2="340.0" y2="290.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="365.0" y="305.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748b" font-weight="bold" text-anchor="middle">T3</text><line x1="610.0" y1="225.0" x2="660.0" y2="225.0" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr)"/><text x="635.0" y="210.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#b45309" font-weight="bold" text-anchor="middle">T4</text><path d="M 770 270 C 770 380 220 380 220 270" fill="none" stroke="#0f4c81" stroke-width="1.6"/><text x="495.0" y="395.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0f4c81" font-weight="normal" text-anchor="middle">T5:恢复请求 + 监测到 128 次空闲(11 连续隐性位)→ 计数清零</text><line x1="220.0" y1="270.0" x2="220.0" y2="250.0" stroke="#0f4c81" stroke-width="1.8" marker-end="url(#arr)"/><text x="515.0" y="470.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">计数增减(§8.1.4):成功收发递减,错误递增;主动/被动节点规则不同</text><text x="515.0" y="500.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#1f2933" font-weight="bold" text-anchor="middle">故障遏制保证单个故障节点不会拖垮总线</text></svg>

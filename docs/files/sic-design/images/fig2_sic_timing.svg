ans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">总线</text><path d="M 90.0 260.0 L 180.0 260.0 L 180.0 260.0 L 390.0 260.0 L 390.0 320.0" fill="none" stroke="#0a3a63" stroke-width="2.2" stroke-linejoin="round"/><rect x="90.0" y="360.0" width="210.0" height="34.0" rx="6" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/><text x="195.0" y="381.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b3a12" font-weight="bold" text-anchor="middle">显性 R≈50 Ω</text><rect x="300.0" y="360.0" width="390.0" height="34.0" rx="6" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="495.0" y="381.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0a3a63" font-weight="bold" text-anchor="middle">有源隐性 R≈100 Ω(RDIFF_act_rec 75~133 Ω)</text><rect x="690.0" y="360.0" width="250.0" height="34.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/><text x="815.0" y="381.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="bold" text-anchor="middle">被动隐性 R≈60 kΩ</text><line x1="90.0" y1="330.0" x2="300.0" y2="330.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr)"/><text x="195.0" y="322.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#d97706" font-weight="normal" text-anchor="middle">tact_rec_start ≤ 120 ns</text><line x1="300.0" y1="440.0" x2="690.0" y2="440.0" stroke="#0f4c81" stroke-width="1.6" marker-end="url(#arr)"/><text x="495.0" y="432.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0f4c81" font-weight="normal" text-anchor="middle">tact_rec_end ≥ 355 ns</text><line x1="690.0" y1="330.0" x2="940.0" y2="330.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="815.0" y="322.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">tpas_rec_start ≤ 530 ns</text><text x="515.0" y="500.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">tSIC_TX_base(+300~+530 ns,自 TXD 上升沿 50% 阈值起测)覆盖整个数据相位隐性位</text></svg>

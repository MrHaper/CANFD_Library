<text x="70.0" y="110.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">总线</text><path d="M 110.0 140.0 L 220.0 140.0 L 220.0 140.0 L 510.0 140.0 L 510.0 195.0 L 840.0 195.0 L 840.0 195.0 L 1270.0 195.0 L 1270.0 140.0 L 1740.0 140.0 L 1740.0 195.0 L 2310.0 195.0 L 2310.0 140.0 L 2920.0 140.0 L 2920.0 195.0 L 3640.0 195.0 L 3640.0 140.0" fill="none" stroke="#0f4c81" stroke-width="2.2" stroke-linejoin="round"/><text x="200.0" y="120.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#d97706" font-weight="normal" text-anchor="middle">显性 ≥ tFilter</text><text x="380.0" y="120.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b" font-weight="normal" text-anchor="middle">隐性 ≥ tFilter</text><text x="520.0" y="120.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#d97706" font-weight="normal" text-anchor="middle">显性 ≥ tFilter</text><line x1="290.0" y1="170.0" x2="330.0" y2="170.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrA)"/><line x1="430.0" y1="170.0" x2="470.0" y2="170.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrA)"/><rect x="290.0" y="230.0" width="280.0" height="40.0" rx="6" fill="#fff3dd" stroke="#d97706" stroke-width="1.3"/><text x="430.0" y="256.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#5b3a12" font-weight="bold" text-anchor="middle">唤醒模式 WUP:两个显性脉冲</text><text x="70.0" y="340.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">RXD(唤醒输出)</text><path d="M 110.0 425.0 L 220.0 425.0 L 220.0 425.0 L 510.0 425.0 L 510.0 370.0 L 1120.0 370.0 L 1120.0 425.0 L 1840.0 425.0 L 1840.0 370.0" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linejoin="round"/><rect x="110.0" y="440.0" width="380.0" height="90.0" rx="10" fill="#eaf1fb" stroke="#0f4c81" stroke-width="1.3"/><text x="300.0" y="470.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0a3a63" font-weight="bold" text-anchor="middle">tFilter:长 0.5~5.0 µs / 短 0.15~1.8 µs</text><text x="300.0" y="495.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">tWake:800 µs ~ 10 ms(可选)</text><rect x="530.0" y="440.0" width="380.0" height="90.0" rx="10" fill="#e7f6ef" stroke="#16a34a" stroke-width="1.3"/><text x="720.0" y="470.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#0b4b37" font-weight="bold" text-anchor="middle">选择性唤醒 WUF:按帧 ID 过滤</text><text x="720.0" y="495.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#0b4b37" font-weight="normal" text-anchor="middle">Standby/Sleep 模式均依赖唤醒机制</text><text x="515.0" y="570.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748b" font-weight="normal" text-anchor="middle">设计关联:唤醒滤波器决定抗毛刺与唤醒延迟的折衷</text></svg>

<text x="70.0" y="120.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">控制器 TXD</text><path d="M 100.0 150.0 L 200.0 150.0 L 200.0 150.0 L 460.0 150.0 L 460.0 205.0 L 980.0 205.0 L 980.0 205.0 L 1760.0 205.0 L 1760.0 150.0" fill="none" stroke="#0f4c81" stroke-width="2.2" stroke-linejoin="round"/><text x="70.0" y="260.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">总线</text><path d="M 190.0 290.0 L 380.0 290.0 L 380.0 290.0 L 730.0 290.0 L 730.0 345.0 L 1340.0 345.0 L 1340.0 345.0 L 2210.0 345.0 L 2210.0 290.0" fill="none" stroke="#0a3a63" stroke-width="2.2" stroke-linejoin="round"/><text x="70.0" y="400.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">收发器 RXD(回读)</text><path d="M 270.0 430.0 L 540.0 430.0 L 540.0 430.0 L 970.0 430.0 L 970.0 485.0 L 1660.0 485.0 L 1660.0 485.0 L 2610.0 485.0 L 2610.0 430.0" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linejoin="round"/><line x1="360.0" y1="205.0" x2="450.0" y2="345.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/><text x="355.0" y="235.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">td(TXD→bus)</text><line x1="450.0" y1="345.0" x2="540.0" y2="485.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/><text x="545.0" y="420.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="middle">td(bus→RXD)</text><line x1="360.0" y1="160.0" x2="540.0" y2="450.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrA)" stroke-dasharray="5 4"/><text x="600.0" y="265.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#d97706" font-weight="normal" text-anchor="middle">环回延迟 tLoop ≤ 190 ns</text><line x1="520.0" y1="90.0" x2="520.0" y2="560.0" stroke="#0f4c81" stroke-width="1.4" stroke-dasharray="4 4"/><text x="520.0" y="80.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#0f4c81" font-weight="normal" text-anchor="middle">正常采样点</text><line x1="780.0" y1="90.0" x2="780.0" y2="560.0" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 4"/><text x="780.0" y="80.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#16a34a" font-weight="normal" text-anchor="middle">SSP 二次采样点</text><line x1="520.0" y1="530.0" x2="780.0" y2="530.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrG)"/><text x="650.0" y="545.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#16a34a" font-weight="normal" text-anchor="middle">TDC 偏移(可编程,tq 为单位)</text><text x="515.0" y="600.0" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#64748b" font-weight="normal" text-anchor="middle">数据相位位时间 ≤1000 ns 时应使用 TDC;环回延迟越小、对称性越好,SSP 裕量越大</text></svg>

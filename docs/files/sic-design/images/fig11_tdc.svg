<text x="36" y="30" font-size="22" font-weight="bold" fill="#ffffff">图 11 TDC 发射器延迟补偿原理</text>
<text x="36" y="51" font-size="13" fill="#c7d6ea">SSP = 测得环回延迟 + 可编程 TDC 偏移(以 tq 为单位)</text>
<defs>
